name: Production Smoke

on:
  # Production is live by the time CI on main finishes. Docs, markdown and screenshot pushes do not run CI, so they do not smoke.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Production Smoke
    # The branches filter above matches the branch name only: a fork's own main would pass it, so the push and the repository are checked here.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://hedging-sheet.vercel.app
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # No ref: on workflow_run this is the default branch, never the commit that triggered CI.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: Five read-only checks
        env:
          # Sent as a header so a protected deployment answers; never printed, and cleaned out of reports/ by test-run.ts.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:vercel -- --url "$BASE_URL" --smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prod-smoke-report
          retention-days: 3
          path: reports
          if-no-files-found: ignore

  issue:
    name: Open An Issue When Production Fails
    needs: smoke
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Production Smoke Failed · $(TZ=Asia/Kolkata date '+%d-%b-%Y %H:%M IST')" \
            --body "The read-only production checks failed against https://hedging-sheet.vercel.app. Run and reports: $RUN_URL"
