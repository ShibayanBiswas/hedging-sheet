name: Production Smoke

on:
  # Production is live by the time CI on main finishes. Docs, markdown and screenshot pushes do not run CI, so they do not smoke.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Production Smoke
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://hedging-sheet.vercel.app
      NEXT_TELEMETRY_DISABLED: "1"
      # Sent as a header so a protected deployment answers; never printed.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:prod
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prod-smoke-report
          retention-days: 3
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Open an issue when production fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "Production Smoke Failed · $(TZ=Asia/Kolkata date '+%d-%b-%Y %H:%M IST')" \
            --body "The read-only production checks failed against $BASE_URL. Run, reports and traces: $RUN_URL"
