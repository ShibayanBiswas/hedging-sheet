name: Nightly

on:
  # 02:00 IST.
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  all-browsers:
    name: Every Browser On A Local Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: echo "CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: npm run test:local
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-nightly-local
          path: reports
          if-no-files-found: ignore

  live-yahoo:
    name: Live Yahoo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:yahoo
