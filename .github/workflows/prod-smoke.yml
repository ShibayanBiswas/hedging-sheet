name: Production Smoke

on:
  # Vercel deploys main within a minute or two; CI takes longer, so production is live when CI finishes.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  deployment_status:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: Read-Only Smoke Against The Deployment
    if: >-
      (github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url || 'https://hedging-sheet.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:prod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-smoke-report
          path: |
            playwright-report
            test-results/junit-e2e.xml
            test-results/playwright
          if-no-files-found: ignore
