name: Production Smoke

on:
  # This repository has never received a deployment_status event: Vercel does not post GitHub
  # deployment events here. Smoke therefore runs after CI succeeds on main, when production is already live.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # A real Production deployment event, if one arrives, still smokes that deployment.
  deployment_status:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  smoke:
    name: Read-Only Smoke Against The Production Deployment
    if: >-
      (github.event_name != 'deployment_status' ||
        (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url || 'https://hedging-sheet.vercel.app' }}
      # Sent as a header so protected deployments answer; never printed.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:prod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-smoke-report
          path: |
            playwright-report
            test-results/junit-e2e.xml
            test-results/playwright
          if-no-files-found: ignore
